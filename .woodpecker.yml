# .woodpecker.yml — drop this in the root of each Java/Gradle repo.
#
# Assumptions about your repo:
#   - Uses the Gradle wrapper (./gradlew)
#   - Version is declared in gradle.properties as:   version=1.2.3
#     (if it's in build.gradle.kts instead, see README to move it)
#   - publishing { } block matches the pattern in your shared build.gradle.kts:
#     a Reposilite repo named "reposiliteRepositoryPrivate" using
#     credentials(PasswordCredentials::class)
#
# Per-repo secrets needed (Woodpecker UI -> Repo -> Settings -> Secrets):
#   reposilite_user        Reposilite username with write access to /private
#   reposilite_password    Reposilite token/password
#   git_push_token         GitHub PAT with `repo` scope (push back the bump commit + tag)

when:
  - event: push
  - event: pull_request

steps:
  build:
    image: eclipse-temurin:21-jdk
    commands:
      - chmod +x ./gradlew
      - ./gradlew --no-daemon --no-configuration-cache assemble

  # ---- Everything below runs only on push to dev/4.0.0 ----

  bump-version:
    image: eclipse-temurin:21-jdk
    commands:
      # Read current version from gradle.properties
      - CURRENT=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
      - BASE=$${CURRENT%-SNAPSHOT}
      - MAJOR=$(echo $BASE | cut -d. -f1)
      - MINOR=$(echo $BASE | cut -d. -f2)
      - PATCH=$(echo $BASE | cut -d. -f3)
      - NEW="$MAJOR.$MINOR.$((PATCH + 1))"
      - echo "Bumping $CURRENT -> $NEW"
      - sed -i "s/^version=.*/version=$NEW/" gradle.properties
      - echo $NEW > .new-version
    when:
      branch: dev/4.0.0
      event: push
    depends_on:
      - build

  publish:
    image: eclipse-temurin:21-jdk
    commands:
      - chmod +x ./gradlew
      # Gradle picks these up automatically as project properties
      # `reposiliteRepositoryPrivateUsername` / `reposiliteRepositoryPrivatePassword`
      # because of credentials(PasswordCredentials::class) in build.gradle.kts
      - ./gradlew --no-daemon --no-configuration-cache publish
    environment:
      ORG_GRADLE_PROJECT_reposiliteRepositoryPrivateUsername:
        from_secret: reposilite_user
      ORG_GRADLE_PROJECT_reposiliteRepositoryPrivatePassword:
        from_secret: reposilite_password
    when:
      branch: dev/4.0.0
      event: push
    depends_on:
      - bump-version

  tag-and-push:
    image: alpine/git:latest
    commands:
      - NEW=$(cat .new-version)
      - git config user.email "woodpecker-ci@islandmine.net"
      - git config user.name "Woodpecker CI"
      - git remote set-url origin https://x-access-token:$${GIT_PUSH_TOKEN}@github.com/$${CI_REPO}.git
      - git add gradle.properties
      - 'git commit -m "chore(release): v$NEW [CI SKIP]"'
      - git tag -a "v$NEW" -m "Release v$NEW"
      - git push origin HEAD:dev/4.0.0
      - git push origin "v$NEW"
    environment:
      GIT_PUSH_TOKEN:
        from_secret: git_push_token
    when:
      branch: dev/4.0.0
      event: push
    depends_on:
      - publish
